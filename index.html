<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Azka</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #050308;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Background */

.intro {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
    radial-gradient(circle at 50% 45%, rgba(150, 70, 210, 0.38), transparent 42%),
    radial-gradient(circle at 15% 80%, rgba(90, 30, 150, 0.30), transparent 38%),
    radial-gradient(circle at 85% 20%, rgba(110, 40, 170, 0.20), transparent 35%),
    #07040d;
}

/* Soft glow */

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(130, 65, 180, 0.18);
    filter: blur(90px);
    animation: pulse 5s ease-in-out infinite;
}

/* Stars */

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.35;
    animation: drift 8s linear infinite;
}

.star:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
.star:nth-child(2) { left: 20%; top: 60%; animation-delay: 2s; }
.star:nth-child(3) { left: 35%; top: 90%; animation-delay: 1s; }
.star:nth-child(4) { left: 50%; top: 75%; animation-delay: 3s; }
.star:nth-child(5) { left: 65%; top: 85%; animation-delay: 1.5s; }
.star:nth-child(6) { left: 78%; top: 65%; animation-delay: 2.5s; }
.star:nth-child(7) { left: 90%; top: 85%; animation-delay: 0.5s; }
.star:nth-child(8) { left: 45%; top: 55%; animation-delay: 4s; }

/* Main content */

.content {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 600px;
    text-align: center;
}

/* Top text */

.kicker {
    color: #9c8ba7;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0;
    animation: appear 1.2s ease 0.3s forwards;
}

/* Lock */

.lock {
    width: 105px;
    height: 105px;
    margin: 0 auto 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 35px rgba(140,70,190,0.25),
        inset 0 0 30px rgba(255,255,255,0.025);

    opacity: 0;
    animation:
        lockIn 1.4s ease 0.5s forwards,
        floating 4s ease-in-out 2s infinite;
}

.lock span {
    font-size: 52px;
    filter: drop-shadow(0 0 15px rgba(190,120,240,0.65));
}

/* Title */

h1 {
    font-size: clamp(42px, 11vw, 72px);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -2px;
    margin-bottom: 22px;

    opacity: 0;
    animation: appear 1.4s ease 0.9s forwards;
}

h1 span {
    background: linear-gradient(
        90deg,
        #ffffff,
        #c9a5dd,
        #ffffff
    );

    background-size: 200%;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: shine 5s linear infinite;
}

/* Description */

.description {
    max-width: 450px;
    margin: 0 auto 38px;

    color: #9d98a3;

    font-size: 15px;
    line-height: 1.8;

    opacity: 0;
    animation: appear 1.4s ease 1.3s forwards;
}

/* Button */

.unlock {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    min-width: 165px;

    padding: 15px 28px;

    border-radius: 50px;

    border: 1px solid rgba(255,255,255,0.20);

    background: rgba(255,255,255,0.055);

    color: white;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    backdrop-filter: blur(12px);

    opacity: 0;

    animation: appear 1.4s ease 1.7s forwards;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.unlock:hover {
    transform: translateY(-3px);

    background: rgba(255,255,255,0.11);

    box-shadow:
        0 12px 40px rgba(120,60,170,0.25);
}

.unlock:active {
    transform: scale(0.95);
}

.arrow {
    font-size: 18px;
}

/* Bottom */

.bottom {
    position: absolute;

    bottom: 22px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #4c4650;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0;

    animation: appear 1.5s ease 2.2s forwards;
}

/* Animations */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lockIn {
    from {
        opacity: 0;
        transform: scale(0.6);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(0.85);
        opacity: 0.55;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

@keyframes shine {
    0% {
        background-position: 0%;
    }

    100% {
        background-position: 200%;
    }
}

@keyframes drift {
    0% {
        transform: translateY(30px);
        opacity: 0;
    }

    20% {
        opacity: 0.4;
    }

    80% {
        opacity: 0.15;
    }

    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }
}

/* Phone */

@media (max-width: 500px) {

    .lock {
        width: 92px;
        height: 92px;
    }

    .lock span {
        font-size: 46px;
    }

    h1 {
        font-size: 44px;
    }

    .description {
        font-size: 14px;
        padding: 0 10px;
    }

    .kicker {
        font-size: 10px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<section class="intro">

    <div class="glow"></div>

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="content">

        <div class="kicker">
            A little something
        </div>

        <div class="lock">
            <span>🔐</span>
        </div>

        <h1>
            There's something<br>
            <span>waiting for you.</span>
        </h1>

        <p class="description">
            Not everything is meant to be opened at once.
            Some things are better when you discover them
            one step at a time.
        </p>

        <button class="unlock" onclick="unlock()">
            Unlock
            <span class="arrow">→</span>
        </button>

    </div>

    <div class="bottom">
        something made just for you
    </div>

</section>

<script>

function unlock() {

    const button = document.querySelector(".unlock");

    button.innerHTML = "Unlocking...";
    button.style.pointerEvents = "none";

    setTimeout(function() {

        button.innerHTML = "Unlocked ✓";

        setTimeout(function() {

            alert("Okay... you unlocked the first part 👀");

            const firstPage = document.querySelector(".intro");
            const secondPage = document.querySelector(".page");

            if (firstPage && secondPage) {

                firstPage.style.display = "none";
                secondPage.style.display = "flex";

                window.scrollTo(0, 0);
            }

        }, 300);

    }, 900);
}

</script>

<!-- PAGE 2 — ANIME TRIAL -->

<style>
.anime-page {
    min-height: 100vh;
    width: 100%;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #050507;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* CINEMATIC BACKGROUND */

.anime-bg {
    position: absolute;
    inset: 0;
    transition: all 0.8s ease;
    z-index: 0;
}

.anime-bg.one {
    background:
        radial-gradient(circle at 72% 18%, rgba(210,225,255,.28), transparent 13%),
        radial-gradient(ellipse at 50% 82%, rgba(20,110,170,.40), transparent 48%),
        repeating-linear-gradient(165deg, transparent 0 20px, rgba(90,190,230,.06) 21px 22px),
        linear-gradient(180deg,#06111e,#071b2b 50%,#02050a);
}

.anime-bg.two {
    background:
        radial-gradient(ellipse at 72% 40%, rgba(205,195,175,.20), transparent 22%),
        radial-gradient(ellipse at 20% 70%, rgba(100,75,50,.25), transparent 40%),
        linear-gradient(90deg,rgba(5,5,5,.9),transparent 50%,rgba(5,5,5,.9)),
        linear-gradient(180deg,#151716,#39352f 50%,#070605);
}

.anime-bg.three {
    background:
        radial-gradient(circle at 55% 23%, rgba(220,230,255,.22), transparent 18%),
        linear-gradient(105deg,transparent 0 38%,rgba(170,190,220,.08) 39%,transparent 40%),
        linear-gradient(75deg,transparent 0 62%,rgba(170,190,220,.06) 63%,transparent 64%),
        linear-gradient(180deg,#0d1119,#191d28 50%,#040508);
}

.anime-bg.four {
    background:
        radial-gradient(ellipse at 50% 28%,rgba(235,185,105,.22),transparent 20%),
        linear-gradient(90deg,rgba(0,0,0,.94),transparent 30%,transparent 70%,rgba(0,0,0,.94)),
        repeating-linear-gradient(90deg,#16120f 0 9%,#251c15 9.2% 10%),
        linear-gradient(180deg,#24190f,#060504);
}

.anime-bg.five {
    background:
        radial-gradient(ellipse at 50% 25%,rgba(240,240,255,.23),transparent 18%),
        radial-gradient(ellipse at 50% 90%,rgba(105,80,150,.25),transparent 42%),
        linear-gradient(90deg,#020207,#17141e 50%,#020207);
}

/* DARK OVERLAY */

.anime-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at center,transparent 20%,rgba(0,0,0,.35) 75%),
        linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65));
}

/* CARD */

.anime-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
}

.anime-card {
    width: 100%;
    box-sizing: border-box;
    padding: 28px 22px;
    border-radius: 24px;
    text-align: center;

    background: rgba(8,8,13,.82);

    border: 1px solid rgba(255,255,255,.13);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.06);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.anime-level {
    font-size: 11px;
    letter-spacing: 4px;
    opacity: .55;
    margin-bottom: 9px;
}

.anime-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.anime-badge {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 50px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.anime-number {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: .5;
    margin-bottom: 13px;
}

.anime-question {
    font-size: 20px;
    line-height: 1.45;
    font-weight: 700;
    margin-bottom: 22px;
}

.anime-answers {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.anime-answers button {
    width: 100%;
    padding: 14px 15px;
    border-radius: 14px;

    background: rgba(255,255,255,.055);
    color: #fff;

    border: 1px solid rgba(255,255,255,.12);

    font-size: 15px;
    cursor: pointer;

    transition: .2s ease;
}

.anime-answers button:active {
    transform: scale(.98);
}

.anime-answers button:hover {
    background: rgba(255,255,255,.10);
}

.anime-message {
    min-height: 24px;
    margin-top: 17px;
    font-size: 14px;
    font-weight: 600;
}

.anime-next,
.anime-retry {
    display: none;
    margin-top: 13px;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    background: rgba(120,95,255,.30);
    font-size: 14px;
    cursor: pointer;
}

.anime-retry {
    background: rgba(255,255,255,.09);
}

@media (max-width: 500px) {
    .anime-page {
        padding: 18px 13px;
    }

    .anime-card {
        padding: 25px 17px;
        border-radius: 21px;
    }

    .anime-title {
        font-size: 24px;
    }

    .anime-question {
        font-size: 18px;
    }
}
</style>

<section class="anime-page">

    <div class="anime-bg one" id="animeBackground"></div>

    <div class="anime-wrap">

        <div class="anime-card">

            <div class="anime-level">
                LEVEL 01
            </div>

            <div class="anime-title">
                THE ANIME TRIAL
            </div>

            <div class="anime-badge">
                ANIME
            </div>

            <div class="anime-number" id="animeNumber">
                CHALLENGE 01
            </div>

            <div class="anime-question" id="animeQuestion">
                Loading...
            </div>

            <div class="anime-answers" id="animeAnswers"></div>

            <div class="anime-message" id="animeMessage"></div>

            <button class="anime-retry" id="animeRetry">
                Try Again
            </button>

            <button class="anime-next" id="animeNext">
                Next Challenge
            </button>

        </div>

    </div>

</section>

<script>

const animeData = [

    {
        question: "Who is the main character of Demon Slayer?",
        answers: [
            "Tanjiro Kamado",
            "Zenitsu Agatsuma",
            "Inosuke Hashibira"
        ],
        correct: 0,
        background: "one"
    },

    {
        question: "What is the name of the organization that fights Titans?",
        answers: [
            "Survey Corps",
            "Demon Slayer Corps",
            "Jujutsu Society"
        ],
        correct: 0,
        background: "two"
    },

    {
        question: "Who is Toji Fushiguro?",
        answers: [
            "A powerful non-sorcerer assassin",
            "A Titan shifter",
            "A Demon Slayer"
        ],
        correct: 0,
        background: "three"
    },

    {
        question: "What is the Underground City in Attack on Titan?",
        answers: [
            "An underground settlement beneath the capital",
            "A secret Titan forest",
            "A Demon Slayer headquarters"
        ],
        correct: 0,
        background: "four"
    },

    {
        question: "Which anime is Toji Fushiguro from?",
        answers: [
            "Attack on Titan",
            "Demon Slayer",
            "Jujutsu Kaisen"
        ],
        correct: 2,
        background: "five"
    }

];

let animeIndex = 0;
let animeLocked = false;


function loadAnimeQuestion() {

    const data = animeData[animeIndex];

    document.getElementById("animeNumber").textContent =
        "CHALLENGE " +
        String(animeIndex + 1).padStart(2,"0");

    document.getElementById("animeQuestion").textContent =
        data.question;

    document.getElementById("animeMessage").textContent = "";

    document.getElementById("animeRetry").style.display = "none";

    document.getElementById("animeNext").style.display = "none";

    animeLocked = false;

    const background =
        document.getElementById("animeBackground");

    background.className =
        "anime-bg " + data.background;

    const answers =
        document.getElementById("animeAnswers");

    answers.innerHTML = "";

    data.answers.forEach(function(answer,index) {

        const button =
            document.createElement("button");

        button.textContent = answer;

        button.onclick = function() {
            checkAnimeAnswer(index,button);
        };

        answers.appendChild(button);

    });

}


function checkAnimeAnswer(index,button) {

    if (animeLocked) return;

    const data = animeData[animeIndex];

    const message =
        document.getElementById("animeMessage");

    if (index === data.correct) {

        animeLocked = true;

        message.textContent = "Correct ✓";

        button.style.background =
            "rgba(60,180,110,.22)";

        button.style.borderColor =
            "rgba(100,220,150,.45)";

        if (animeIndex < animeData.length - 1) {

            document.getElementById("animeNext")
                .style.display = "inline-block";

        } else {

            message.textContent =
                "You completed the Anime Trial ✓";

        }

    } else {

        message.textContent =
            "Not quite 👀 Try again.";

        button.style.background =
            "rgba(220,70,80,.18)";

        button.style.borderColor =
            "rgba(255,100,110,.4)";

        document.getElementById("animeRetry")
            .style.display = "inline-block";

    }

}


document.getElementById("animeRetry").onclick =
function() {

    loadAnimeQuestion();

};


document.getElementById("animeNext").onclick =
function() {

    if (animeIndex < animeData.length - 1) {

        animeIndex++;

        loadAnimeQuestion();

    }

};


loadAnimeQuestion();

</script>
    
</body>
</html>
