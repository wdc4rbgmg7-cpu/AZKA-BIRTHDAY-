<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Azka</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #050308;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Background */

.intro {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(105, 45, 150, 0.20), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(65, 20, 100, 0.16), transparent 30%),
        #050308;
}

/* Soft glow */

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(130, 65, 180, 0.18);
    filter: blur(90px);
    animation: pulse 5s ease-in-out infinite;
}

/* Stars */

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.35;
    animation: drift 8s linear infinite;
}

.star:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
.star:nth-child(2) { left: 20%; top: 60%; animation-delay: 2s; }
.star:nth-child(3) { left: 35%; top: 90%; animation-delay: 1s; }
.star:nth-child(4) { left: 50%; top: 75%; animation-delay: 3s; }
.star:nth-child(5) { left: 65%; top: 85%; animation-delay: 1.5s; }
.star:nth-child(6) { left: 78%; top: 65%; animation-delay: 2.5s; }
.star:nth-child(7) { left: 90%; top: 85%; animation-delay: 0.5s; }
.star:nth-child(8) { left: 45%; top: 55%; animation-delay: 4s; }

/* Main content */

.content {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 600px;
    text-align: center;
}

/* Top text */

.kicker {
    color: #9c8ba7;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0;
    animation: appear 1.2s ease 0.3s forwards;
}

/* Lock */

.lock {
    width: 105px;
    height: 105px;
    margin: 0 auto 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 35px rgba(140,70,190,0.25),
        inset 0 0 30px rgba(255,255,255,0.025);

    opacity: 0;
    animation:
        lockIn 1.4s ease 0.5s forwards,
        floating 4s ease-in-out 2s infinite;
}

.lock span {
    font-size: 52px;
    filter: drop-shadow(0 0 15px rgba(190,120,240,0.65));
}

/* Title */

h1 {
    font-size: clamp(42px, 11vw, 72px);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -2px;
    margin-bottom: 22px;

    opacity: 0;
    animation: appear 1.4s ease 0.9s forwards;
}

h1 span {
    background: linear-gradient(
        90deg,
        #ffffff,
        #c9a5dd,
        #ffffff
    );

    background-size: 200%;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: shine 5s linear infinite;
}

/* Description */

.description {
    max-width: 450px;
    margin: 0 auto 38px;

    color: #9d98a3;

    font-size: 15px;
    line-height: 1.8;

    opacity: 0;
    animation: appear 1.4s ease 1.3s forwards;
}

/* Button */

.unlock {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    min-width: 165px;

    padding: 15px 28px;

    border-radius: 50px;

    border: 1px solid rgba(255,255,255,0.20);

    background: rgba(255,255,255,0.055);

    color: white;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    backdrop-filter: blur(12px);

    opacity: 0;

    animation: appear 1.4s ease 1.7s forwards;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.unlock:hover {
    transform: translateY(-3px);

    background: rgba(255,255,255,0.11);

    box-shadow:
        0 12px 40px rgba(120,60,170,0.25);
}

.unlock:active {
    transform: scale(0.95);
}

.arrow {
    font-size: 18px;
}

/* Bottom */

.bottom {
    position: absolute;

    bottom: 22px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #4c4650;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0;

    animation: appear 1.5s ease 2.2s forwards;
}

/* Animations */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lockIn {
    from {
        opacity: 0;
        transform: scale(0.6);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(0.85);
        opacity: 0.55;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

@keyframes shine {
    0% {
        background-position: 0%;
    }

    100% {
        background-position: 200%;
    }
}

@keyframes drift {
    0% {
        transform: translateY(30px);
        opacity: 0;
    }

    20% {
        opacity: 0.4;
    }

    80% {
        opacity: 0.15;
    }

    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }
}

/* Phone */

@media (max-width: 500px) {

    .lock {
        width: 92px;
        height: 92px;
    }

    .lock span {
        font-size: 46px;
    }

    h1 {
        font-size: 44px;
    }

    .description {
        font-size: 14px;
        padding: 0 10px;
    }

    .kicker {
        font-size: 10px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<section class="intro">

    <div class="glow"></div>

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="content">

        <div class="kicker">
            A little something
        </div>

        <div class="lock">
            <span>🔐</span>
        </div>

        <h1>
            There's something<br>
            <span>waiting for you.</span>
        </h1>

        <p class="description">
            Not everything is meant to be opened at once.
            Some things are better when you discover them
            one step at a time.
        </p>

        <button class="unlock" onclick="unlock()">
            Unlock
            <span class="arrow">→</span>
        </button>

    </div>

    <div class="bottom">
        something made just for you
    </div>

</section>

<script>

function unlock() {

    const button = document.querySelector(".unlock");

    button.innerHTML = "Unlocking...";

    button.style.pointerEvents = "none";

    setTimeout(function() {

        button.innerHTML = 'Unlocked ✓';

        setTimeout(function() {

            alert("Okay... you unlocked the first part 👀");

        }, 300);

    }, 900);
}

</script>

</body>
</html>
